spring.application.name=patient-service
server.port=8080

# ==============================================================================
# DATABASE CONFIGURATION & SPRING BOOT RELAXED BINDING
# ==============================================================================
# The values below serve as fallback defaults (e.g. when running `./mvnw test` on host).
#
# When running inside Docker or production, Spring Boot uses "Relaxed Binding" to
# automatically OVERRIDE these dot-separated properties with uppercase environment
# variables passed to the container:
#   - SPRING_DATASOURCE_URL      -> overrides spring.datasource.url
#   - SPRING_DATASOURCE_USERNAME -> overrides spring.datasource.username
#   - SPRING_DATASOURCE_PASSWORD -> overrides spring.datasource.password
#
# Docker DNS: In the URL `jdbc:postgresql://patient-service-db:5432/patient_db`,
# the hostname `patient-service-db` is resolved by Docker's embedded DNS server (127.0.0.11)
# to the PostgreSQL container's IP on the shared `internal` bridge network.

# This is only used if we run the project on the Mac to have in-memory db
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=user
spring.datasource.password=password
# ==============================================================================

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Require broker acknowledgment and bound Kafka's delivery retries.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
